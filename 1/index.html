<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Un detalle especial para el 21 de septiembre."
    />
    <title>Un detalle para ti</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="screen screen--welcome" id="welcome-screen">
        <div class="welcome-card">
          <h1>Tengo algo para ti <span class="heart" aria-label="con cariño"></span>🪩</h1>
          <button class="open-button" id="open-button" type="button">
            Abrir
          </button>
          <p class="welcome-date">21 de septiembre</p>
        </div>
      </section>

      <section
        class="screen screen--message"
        id="message-screen"
        aria-hidden="true"
      >
        <article class="message-card">
          <header class="message-header">
            <p class="eyebrow">21 de septiembre</p>
            <h2 id="recipient-title">para la más homosensual</h2>
          </header>
          <div class="cosmic-scene" id="cosmic-scene">
            <p class="cosmic-title" id="cosmic-title"></p>
            <canvas
              class="universe-canvas"
              id="universe-canvas"
              aria-label="Campo infinito de girasoles bajo un cielo estrellado"
            ></canvas>
          </div>
          <section class="closing-card" aria-label="Mensaje para las más homosexual">
            <span class="closing-petal closing-petal--left" aria-hidden="true"></span>
            <span class="closing-petal closing-petal--right" aria-hidden="true"></span>
            <p class="closing-intro">
              21 de septiembre estas flores amarillas son para ti :3 
            </p>
            <span class="floral-divider" aria-hidden="true"></span>
            <p class="personal-message" id="personal-message">
              gracias por ser ... tu ! 
            </p>
            <p class="signature" id="signature">— Gustavoo</p>
        </article>
      </section>

      <div class="falling-petals" id="falling-petals" aria-hidden="true"></div>
      <button
        class="music-button"
        id="music-button"
        type="button"
        aria-label="Pausar música"
        title="Pausar música"
      >
        ♪
      </button>
      <audio id="background-music" loop preload="metadata">
        <source src="assets/there-is-romance.mp3" type="audio/mpeg" />
      </audio>
    </main>

    <script src="script.js"></script>
  </body>
</html>
